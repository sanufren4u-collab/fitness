services:
  postgres:
    image: postgres:16-alpine
    container_name: ironpulse_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ironpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - ironpulse_pgdata:/var/lib/postgresql/data

volumes:
  ironpulse_pgdata:
